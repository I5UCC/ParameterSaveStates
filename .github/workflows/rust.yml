name: Rust

on:
  push:
    paths: ["crates/**", "xtask/**", "packaging/**", "assets/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "xtask/**", "packaging/**", "assets/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy without the SteamVR overlay
        run: cargo clippy -p psstates-app --no-default-features -- -D warnings
      - run: cargo test --workspace

      - name: Build and package (without openvr_api)
        run: cargo xtask package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParameterSaveStates-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
